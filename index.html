<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中英文文法與中翻英特訓教室</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pastel: {
              yellow: '#FFF59D',
              yellowLight: '#FFFDE7',
              blue: '#B3E5FC',
              blueLight: '#E1F5FE',
              orange: '#FFCC80',
              orangeLight: '#FFE0B2',
              rose: '#F8BBD0',
              cream: '#FAFAF4'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #FAFAF4; color: #2D3748; font-family: system-ui, -apple-system, sans-serif; }
    .pastel-card { background: #FFFFFF; border: 2px solid #F1F5F9; box-shadow: 0 10px 25px -5px rgba(255, 204, 128, 0.15); }
    .pastel-card-hover { transition: all 0.3s ease; }
    .pastel-card-hover:hover { transform: translateY(-3px); box-shadow: 0 15px 30px -5px rgba(255, 204, 128, 0.3); border-color: #FFE0B2; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-6">

  <div class="max-w-3xl w-full space-y-6">
    <!-- Header -->
    <header class="pastel-card p-6 rounded-3xl text-center bg-gradient-to-r from-yellow-100 via-orange-100 to-pink-100">
      <h1 class="text-2xl font-extrabold text-slate-800 mb-2">
        <i class="fa-solid fa-graduation-cap text-amber-600 mr-2"></i>英語文法解析與中翻英特訓
      </h1>
      <p class="text-sm text-slate-600 font-medium">以中文思考為主體，搭配精緻文法剖析與中翻英特訓卡片！</p>
    </header>

    <!-- 頁籤導覽 -->
    <div class="flex gap-3 bg-white p-2 rounded-2xl pastel-card">
      <button id="tab-learn-btn" onclick="switchTab('learn')" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all bg-amber-100 text-amber-900 shadow-sm">
        📖 中文為主文法解析
      </button>
      <button id="tab-quiz-btn" onclick="switchTab('quiz')" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all text-slate-600 hover:bg-slate-100">
        ✍️ 中翻英雙模式特訓
      </button>
    </div>

    <!-- 學習模式區塊：精緻卡片 -->
    <section id="learn-section" class="space-y-4">
      <div id="cards-container" class="space-y-4"></div>
    </section>

    <!-- 測驗模式區塊：中翻英雙模式 -->
    <section id="quiz-section" class="hidden space-y-4">
      <div class="pastel-card p-6 sm:p-8 rounded-3xl space-y-6">
        <!-- 模式切換 -->
        <div class="flex gap-2 bg-amber-50 p-1.5 rounded-2xl border border-amber-100">
          <button id="mode-a-btn" onclick="setQuizMode('A')" class="flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl bg-white text-slate-800 shadow-sm">
            版本 A：單詞點擊組裝
          </button>
          <button id="mode-b-btn" onclick="setQuizMode('B')" class="flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl text-slate-600">
            版本 B：整句中翻英打字
          </button>
        </div>

        <div class="flex justify-between items-center text-xs font-bold text-slate-500">
          <span id="quiz-progress">進度：1 / 6</span>
          <span id="quiz-score">得分：0</span>
        </div>

        <!-- 中文提示框：字級加大突出 -->
        <div class="p-6 rounded-3xl bg-amber-100/70 border-2 border-amber-200 text-center shadow-sm">
          <div class="text-xs font-bold text-amber-900 uppercase tracking-wider mb-2">請翻譯以下中文：</div>
          <div id="quiz-cn-title" class="text-xl sm:text-2xl font-black text-slate-900 leading-snug">載入中...</div>
        </div>

        <!-- 版本 A UI -->
        <div id="quiz-mode-a-area" class="space-y-4">
          <div id="answer-zone" onclick="resetAnswerZone()" class="min-h-[60px] p-3 rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50 flex flex-wrap gap-2 items-center justify-center cursor-pointer">
            <span class="text-xs text-slate-400 font-bold">點擊下方單詞拼湊句子（點擊此處可清空重選）</span>
          </div>
          <div id="word-pool" class="flex flex-wrap gap-2 justify-center"></div>
        </div>

        <!-- 版本 B UI -->
        <div id="quiz-mode-b-area" class="hidden space-y-3">
          <input type="text" id="type-b-input" placeholder="請在此輸入英文翻譯..." autocomplete="off"
            class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm font-bold font-mono">
        </div>

        <!-- 回饋訊息 -->
        <div id="feedback-box" class="hidden p-4 rounded-2xl text-sm font-bold"></div>

        <!-- 操作按鈕 -->
        <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
          <button onclick="showHint()" class="px-5 py-2.5 rounded-xl font-bold text-xs bg-amber-100 hover:bg-amber-200 text-amber-900 transition-colors">
            <i class="fa-solid fa-lightbulb mr-1"></i>查看提示
          </button>
          <button id="btn-submit" onclick="checkAnswer()" class="px-6 py-2.5 rounded-xl font-bold text-xs bg-gradient-to-r from-amber-300 to-orange-300 text-amber-950 shadow-md">
            檢查答案 <i class="fa-solid fa-arrow-right ml-1"></i>
          </button>
          <button id="btn-next" onclick="nextQuestion()" class="hidden px-6 py-2.5 rounded-xl font-bold text-xs bg-emerald-400 text-emerald-950 shadow-md">
            下一題 <i class="fa-solid fa-angle-right ml-1"></i>
          </button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const grammarData = [
      {
        id: 1,
        sentence: "The sheep have been raised by him since he was six, haven't they?",
        translation: "自從他六歲以來，這些綿羊就一直由他飼養著，不是嗎？",
        grammarPoints: [
          { tag: "單複數同形", detail: "sheep 作為「綿羊」時單複數同形。此處動詞搭配 have，可知為複數概念。" },
          { tag: "完成式被動", detail: "have been raised（已經被飼養），結合完成式（have + p.p.）與被動語態（be + p.p.）。" },
          { tag: "since 子句", detail: "since（自從）引導時間副詞子句，主要子句用現在完成式，since 子句動詞用過去式（was）。" },
          { tag: "否定附加問句", detail: "主要子句為肯定句時，附加問句需用否定型態 haven't they?。" }
        ],
        tags: ["現在完成式", "被動語態", "附加問句", "不規則名詞"],
        words: ["The sheep", "have been raised", "by him", "since", "he was six,", "haven't they?"]
      },
      {
        id: 2,
        sentence: "There is little snow in Taipei in winter, is there?",
        translation: "台北冬天很少下雪，對吧？",
        grammarPoints: [
          { tag: "There is/are 句型", detail: "表示「有……」，後接不可數名詞 snow 用單數動詞 is。" },
          { tag: "little 否定意涵", detail: "little 意為「幾乎沒有」（具否定意涵），不同於 a little（有一些，肯定意涵）。" },
          { tag: "肯定附加問句", detail: "因主句含有否定詞 little，整句視為否定句，因此附加問句需用肯定式 is there?。" }
        ],
        tags: ["There is/are", "否定詞 little", "附加問句"],
        words: ["There is", "little snow", "in Taipei", "in winter,", "is there?"]
      },
      {
        id: 3,
        sentence: "Can the computer be fixed today?",
        translation: "這台電腦今天能修好嗎？",
        grammarPoints: [
          { tag: "情態助動詞疑問句", detail: "將助動詞 Can 置於句首形成一般疑問句。" },
          { tag: "助動詞被動語態", detail: "情態助動詞（Can）後面接原形被動式 be + p.p.（be fixed）。" },
          { tag: "時間副詞", detail: "today 放於句尾作時間修飾。" }
        ],
        tags: ["情態助動詞", "被動語態", "疑問句"],
        words: ["Can", "the computer", "be fixed", "today?"]
      },
      {
        id: 4,
        sentence: "Those baskets weren't made by my grandma last week.",
        translation: "那些籃子不是我奶奶上星期做的。",
        grammarPoints: [
          { tag: "過去簡單被動否定", detail: "主詞 Those baskets 為複數，過去式被動否定使用 weren't made (were + not + p.p.)。" },
          { tag: "動作執行者", detail: "by + my grandma 表明動作由誰執行。" },
          { tag: "過去時間點", detail: "last week 指定過去具體時間，需搭配過去時態。" }
        ],
        tags: ["過去簡單式", "被動語態否定", "時間副詞"],
        words: ["Those baskets", "weren't made", "by my grandma", "last week."]
      },
      {
        id: 5,
        sentence: "Are the lawyers paid once a month?",
        translation: "這些律師一個月支薪一次嗎？",
        grammarPoints: [
          { tag: "現在簡單被動疑問", detail: "主詞 the lawyers 為複數，將 be 動詞 Are 提至句首構成分句疑問句（Are ... paid）。" },
          { tag: "頻率副詞片語", detail: "once a month 表示「一個月一次」，常用於描述定期發生的習慣或狀態。" }
        ],
        tags: ["現在簡單式", "被動語態", "頻率表達"],
        words: ["Are", "the lawyers", "paid", "once a month?"]
      },
      {
        id: 6,
        sentence: "The man should be taken to the hospital right away.",
        translation: "這個男人應該立刻被送往醫院。",
        grammarPoints: [
          { tag: "情態助動詞被動", detail: "should（應該）後接原形被動 be taken（被帶/送）。" },
          { tag: "介系詞片語", detail: "to the hospital（到醫院），指明地點與方向。" },
          { tag: "片語 right away", detail: "意為「立刻、馬上」，等於 immediately 或 at once。" }
        ],
        tags: ["情態助動詞", "被動語態", "實用片語"],
        words: ["The man", "should be taken", "to the hospital", "right away."]
      }
    ];

    let currentTab = 'learn';
    let currentMode = 'A';
    let currentIndex = 0;
    let score = 0;
    let selectedWords = [];

    document.addEventListener('DOMContentLoaded', () => { renderLearnCards(); });

    function switchTab(tab) {
      currentTab = tab;
      const learnSec = document.getElementById('learn-section');
      const quizSec = document.getElementById('quiz-section');
      const learnBtn = document.getElementById('tab-learn-btn');
      const quizBtn = document.getElementById('tab-quiz-btn');

      if (tab === 'learn') {
        learnSec.classList.remove('hidden');
        quizSec.classList.add('hidden');
        learnBtn.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all bg-amber-100 text-amber-900 shadow-sm";
        quizBtn.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all text-slate-600 hover:bg-slate-100";
      } else {
        learnSec.classList.add('hidden');
        quizSec.classList.remove('hidden');
        quizBtn.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all bg-orange-100 text-amber-900 shadow-sm";
        learnBtn.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all text-slate-600 hover:bg-slate-100";
        loadQuiz();
      }
    }

    function renderLearnCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = grammarData.map(item => `
        <div class="pastel-card pastel-card-hover p-6 rounded-3xl space-y-4">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold uppercase tracking-wider text-amber-900 bg-pastel-yellow px-3 py-1 rounded-full border border-yellow-200">
              Sentence #0${item.id}
            </span>
            <button onclick="speak('${item.sentence.replace(/'/g, "\\'")}')" 
                    class="w-10 h-10 rounded-2xl bg-sky-50 hover:bg-sky-100 transition-colors flex items-center justify-center text-sky-800"
                    title="播放發音">
              <i class="fa-solid fa-volume-high text-sm"></i>
            </button>
          </div>

          <!-- 主體中文區域：字級放大、背景加深突出 -->
          <div class="space-y-3">
            <div class="text-lg sm:text-xl font-black text-slate-900 bg-amber-100/80 p-4 rounded-2xl border border-amber-200 shadow-sm leading-snug">
              ${item.translation}
            </div>
            <div class="text-base font-bold text-slate-600 pl-1">
              ${item.sentence}
            </div>
          </div>

          <details class="group/details pt-2 border-t border-slate-100">
            <summary class="cursor-pointer text-xs font-bold text-amber-800 flex items-center justify-between py-1 select-none">
              <span><i class="fa-solid fa-magnifying-glass-chart mr-1.5 text-amber-500"></i>查看文法要點剖析</span>
              <i class="fa-solid fa-chevron-down group-open/details:rotate-180 transition-transform text-xs"></i>
            </summary>
            <div class="mt-3 space-y-2 pt-2">
              ${item.grammarPoints.map(pt => `
                <div class="bg-pastel-yellowLight p-3 rounded-2xl border border-yellow-100">
                  <span class="inline-block text-[11px] font-extrabold text-amber-900 bg-pastel-yellow px-2 py-0.5 rounded-md mr-1.5 border border-yellow-200">
                    ${pt.tag}
                  </span>
                  <span class="text-xs text-slate-700 font-medium leading-relaxed">
                    ${pt.detail}
                  </span>
                </div>
              `).join('')}
            </div>
          </details>

          <div class="flex flex-wrap gap-1.5 pt-1">
            ${item.tags.map(t => `
              <span class="text-[10px] font-bold text-sky-700 bg-sky-50 px-2.5 py-0.5 rounded-full">#${t}</span>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        window.speechSynthesis.speak(u);
      }
    }

    function setQuizMode(mode) {
      currentMode = mode;
      document.getElementById('mode-a-btn').className = `flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl ${mode === 'A' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-600'}`;
      document.getElementById('mode-b-btn').className = `flex-1 py-2 text-xs sm:text-sm font-bold rounded-xl ${mode === 'B' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-600'}`;
      document.getElementById('quiz-mode-a-area').style.display = mode === 'A' ? 'block' : 'none';
      document.getElementById('quiz-mode-b-area').style.display = mode === 'B' ? 'block' : 'none';
      resetQuizState();
    }

    function loadQuiz() {
      const q = grammarData[currentIndex];
      document.getElementById('quiz-progress').innerText = `進度：${currentIndex + 1} / ${grammarData.length}`;
      document.getElementById('quiz-score').innerText = `得分：${score}`;
      document.getElementById('quiz-cn-title').innerText = q.translation;
      resetQuizState();

      if (currentMode === 'A') {
        const shuffled = [...q.words].sort(() => Math.random() - 0.5);
        document.getElementById('word-pool').innerHTML = shuffled.map(w => `
          <button onclick="selectWord(this, '${w}')" class="px-3.5 py-1.5 rounded-xl bg-sky-50 text-sky-900 text-xs font-bold hover:bg-sky-100 transition-colors shadow-sm">
            ${w}
          </button>
        `).join('');
      }
    }

    function selectWord(btn, word) {
      btn.style.display = 'none';
      selectedWords.push({ word, btn });
      updateAnswerZone();
    }

    function updateAnswerZone() {
      const zone = document.getElementById('answer-zone');
      if (selectedWords.length === 0) {
        zone.innerHTML = `<span class="text-xs text-slate-400 font-bold">點擊下方單詞拼湊句子（點擊此處可清空重選）</span>`;
      } else {
        zone.innerHTML = selectedWords.map(i => `
          <span class="px-3 py-1.5 rounded-xl bg-amber-200 text-amber-950 text-xs font-bold shadow-sm">${i.word}</span>
        `).join('');
      }
    }

    function resetAnswerZone() {
      selectedWords.forEach(i => i.btn.style.display = 'inline-block');
      selectedWords = [];
      updateAnswerZone();
    }

    function resetQuizState() {
      selectedWords = [];
      updateAnswerZone();
      document.getElementById('type-b-input').value = '';
      const fb = document.getElementById('feedback-box');
      fb.className = 'hidden p-4 rounded-2xl text-sm font-bold';
      fb.innerText = '';
      document.getElementById('btn-submit').classList.remove('hidden');
      document.getElementById('btn-next').classList.add('hidden');
    }

    function checkAnswer() {
      const q = grammarData[currentIndex];
      let userAns = currentMode === 'A' ? selectedWords.map(i => i.word).join(' ') : document.getElementById('type-b-input').value.trim();

      const cleanUser = userAns.toLowerCase().replace(/[^a-z0-9]/g, '');
      const cleanTarget = q.sentence.toLowerCase().replace(/[^a-z0-9]/g, '');

      const fb = document.getElementById('feedback-box');
      fb.classList.remove('hidden');

      if (cleanUser === cleanTarget) {
        fb.className = "p-4 rounded-2xl text-sm font-bold bg-emerald-100 text-emerald-900 border border-emerald-200";
        fb.innerHTML = `🎉 太棒了！回答完全正確！`;
        score += 15;
        document.getElementById('quiz-score').innerText = `得分：${score}`;
        document.getElementById('btn-submit').classList.add('hidden');
        document.getElementById('btn-next').classList.remove('hidden');
        speak(q.sentence);
      } else {
        fb.className = "p-4 rounded-2xl text-sm font-bold bg-rose-100 text-rose-900 border border-rose-200";
        fb.innerHTML = `❌ 答案有誤，再試一次或點擊提示看看！`;
      }
    }

    function showHint() {
      const q = grammarData[currentIndex];
      const fb = document.getElementById('feedback-box');
      fb.classList.remove('hidden');
      fb.className = "p-4 rounded-2xl text-sm font-bold bg-amber-100 text-amber-900 border border-amber-200";
      fb.innerHTML = `💡 正確英文句型：${q.sentence}`;
    }

    function nextQuestion() {
      currentIndex = (currentIndex + 1) % grammarData.length;
      loadQuiz();
    }
  </script>
</body>
</html>
